model:
  name: gradient_boosting
  threshold: 0.10
  hyperparameters:
    learning_rate: 0.1
    max_depth: 1
    n_estimators: 200

data:
  random_seed: 42

artifacts:
  model_path: models/customer_churn_gradient_boosting.joblib
  metadata_path: models/customer_churn_gradient_boosting_metadata.json
  overwrite: true